---
:resource: Questionnaire
:profile_url: http://hl7.org/fhir/us/davinci-dtr/StructureDefinition/dtr-questionnaire-adapt-search
:profile_name: DTR Questionnaire for adaptive form Search
:profile_version: 2.2.0
:must_supports:
  :extensions:
  - :id: Questionnaire.extension:terminologyServer
    :slice_name: terminologyServer
    :path: extension
    :url: http://hl7.org/fhir/StructureDefinition/preferredTerminologyServer
    :modifier_extension: false
  - :id: Questionnaire.extension:versionAlgorithm
    :slice_name: versionAlgorithm
    :path: extension
    :url: http://hl7.org/fhir/StructureDefinition/artifact-versionAlgorithm
    :modifier_extension: false
  - :id: Questionnaire.extension:performerType
    :slice_name: performerType
    :path: extension
    :url: http://hl7.org/fhir/uv/sdc/StructureDefinition/sdc-questionnaire-performerType
    :modifier_extension: false
  - :id: Questionnaire.extension:assemble-expectation
    :slice_name: assemble-expectation
    :path: extension
    :url: http://hl7.org/fhir/uv/sdc/StructureDefinition/sdc-questionnaire-assemble-expectation
    :modifier_extension: false
  - :id: Questionnaire.extension:questionnaireAdaptive
    :slice_name: questionnaireAdaptive
    :path: extension
    :url: http://hl7.org/fhir/uv/sdc/StructureDefinition/sdc-questionnaire-questionnaireAdaptive
    :modifier_extension: false
  - :id: Questionnaire.extension:entryMode
    :slice_name: entryMode
    :path: extension
    :url: http://hl7.org/fhir/uv/sdc/StructureDefinition/sdc-questionnaire-entryMode
    :modifier_extension: false
  - :id: Questionnaire.extension:signatureRequired
    :slice_name: signatureRequired
    :path: extension
    :url: http://hl7.org/fhir/StructureDefinition/questionnaire-signatureRequired
    :modifier_extension: false
  - :id: Questionnaire.extension:cqf-library
    :slice_name: cqf-library
    :path: extension
    :url: http://hl7.org/fhir/StructureDefinition/cqf-library
    :modifier_extension: false
  - :id: Questionnaire.item.extension:hidden
    :slice_name: hidden
    :path: item.extension
    :url: http://hl7.org/fhir/StructureDefinition/questionnaire-hidden
    :modifier_extension: false
  :slices:
  - :slice_id: Questionnaire.item.answerOption.value[x]:valueCoding
    :slice_name: valueCoding
    :path: item.answerOption.value[x]
    :discriminator:
      :type: type
      :code: Coding
  - :slice_id: Questionnaire.item.answerOption.value[x]:valueReference
    :slice_name: valueReference
    :path: item.answerOption.value[x]
    :discriminator:
      :type: type
      :code: Reference
  :elements:
  - :path: url
  - :path: version
  - :path: title
  - :path: status
  - :path: subjectType
  - :path: effectivePeriod
  - :path: item
  - :path: item.linkId
  - :path: item.prefix
  - :path: item.type
  - :path: item.required
  - :path: item.repeats
  - :path: item.readOnly
  - :path: item.answerValueSet
  - :path: item.answerOption
  - :path: item.answerOption.value[x]
    :types:
    - Reference
  - :path: item.initial
  - :path: item.initial.value[x]
    :types:
    - Reference
  - :path: item.item
  :recursive_elements:
  - item
